name: Test and Release

on: push

permissions:
  contents: write
  id-token: write
  issues: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  tests-matrix:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version:
          - ">=24.22.1 <25"
          - ">=26.12.1 <27"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm
      - name: Authenticate with NPM registry
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
      - name: Install dependencies
        run: npm ci --no-audit
      - name: Compile
        run: npx tsc
      - name: Check source code with eslint
        run: npx eslint .
      - name: Check if source code is properly formatted
        run: npx prettier -c ./
      - name: Test
        run: npm test

  tests:
    runs-on: ubuntu-latest

    needs: [tests-matrix]

    # Stable required status check for the repository rules, independent of
    # the Node.js versions in the matrix.
    if: ${{ always() }}

    steps:
      - name: All tests must have succeeded
        env:
          RESULT: ${{ needs.tests-matrix.result }}
        run: test "$RESULT" = "success"

  release:
    runs-on: ubuntu-24.04

    needs: [tests]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=26.12.1 <27"
          cache: "npm"
      - name: Install NPM version specified in package.json
        uses: ./.github/actions/install-npm
      - name: Authenticate with NPM registry
        run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc
      - name: Install dependencies
        run: npm ci --no-audit
      - name: Semantic release
        run: npx semantic-release
